# Cấu hình chung của bot. Sửa xong thì khởi động lại bot: docker compose restart
# Danh sách VIP, từ khóa và giờ nghỉ được quản lý bằng lệnh trong bot,
# không nằm ở đây.

timezone: Asia/Ho_Chi_Minh

# Từ khóa mặc định, chỉ nạp ở lần chạy đầu tiên. Sau đó dùng lệnh /keyword để sửa.
default_keywords:
  - gấp
  - khẩn
  - urgent
  - asap
  - deadline
  - hợp đồng
  - thanh toán
  - chuyển khoản

mail:
  # Tên hiển thị ở mục "Người gửi" khi gửi email
  from_name: Ngọc Nhất
